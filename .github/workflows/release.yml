# Builds the two shipped configurations and attaches them to a GitHub Release.
#
#   git tag v1.0 && git push origin v1.0
#
# The toolchain is Ubuntu's own gcc-arm-none-eabi, which is what the binaries
# in the v1.0 release were built with, so a tag should reproduce them byte for
# byte apart from the embedded commit hash and build date.
name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install the ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi \
            cmake ninja-build
          arm-none-eabi-gcc --version | head -1

      - name: Replay the Si4732 key handling on the host
        run: tools/si4732_keytest/run.sh

      - name: Build SI4732Ja (short wave, for a modified radio)
        run: |
          cmake --preset SI4732Ja
          cmake --build build/SI4732Ja

      - name: Build FusionJa (stock radio)
        run: |
          cmake --preset FusionJa
          cmake --build build/FusionJa

      - name: Collect the binaries
        run: |
          version="${GITHUB_REF_NAME:-dev}"
          mkdir -p release
          cp build/SI4732Ja/ja-k5.si4732.bin    "release/JA-K5_${version}_si4732.bin"
          cp build/FusionJa/f4hwn.fusion.ja.bin "release/JA-K5_${version}_stock.bin"
          cd release
          sha256sum *.bin | tee SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: .github/release-notes.md

      - name: Keep the binaries when run by hand
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: JA-K5-firmware
          path: release/
